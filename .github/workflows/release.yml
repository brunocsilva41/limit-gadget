name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # Etapa 1: todas as verificações do CI.
  verificacoes:
    name: "Verificações (CI completo)"
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Etapa 2: só roda se TODAS as etapas do CI passaram.
  publicar:
    name: "Publicar release"
    needs: verificacoes
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      LIMITGADGET_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirmar que o commit da tag está na main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::O commit da tag $GITHUB_REF_NAME não está contido em origin/main."
            exit 1
          fi

      - name: Confirmar segredo de assinatura
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Segredo TAURI_SIGNING_PRIVATE_KEY não configurado."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Conferir versões e tag
        run: node scripts/check-versions.mjs

      - name: Extrair notas do CHANGELOG
        id: notas
        shell: bash
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            index($0, "## [" v "]") == 1 { achou = 1; next }
            achou && /^## \[/ { exit }
            achou { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notas.md"; then
            echo "::error::Seção [$versao] ausente ou vazia no CHANGELOG.md."
            exit 1
          fi
          {
            echo 'corpo<<FIM_DAS_NOTAS'
            cat "$RUNNER_TEMP/notas.md"
            echo
            echo 'FIM_DAS_NOTAS'
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Build do frontend
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LimitGadget ${{ github.ref_name }}"
          releaseBody: ${{ steps.notas.outputs.corpo }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
