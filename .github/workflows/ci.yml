name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

# Cancela execuções antigas do mesmo ref, exceto em tags (releases nunca são canceladas).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  LIMITGADGET_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  CARGO_TERM_COLOR: always

jobs:
  # Etapa 1: versões, JSON, pubkey, tag e expressões proibidas.
  consistencia:
    name: "1. Consistência (versões e regras)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-versions.mjs

  # Etapa 2: typecheck, testes e build do frontend.
  frontend:
    name: "2. Frontend (typecheck, testes e build)"
    needs: consistencia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # Etapa 3: formatação, lint e testes do Rust (o Tauri exige ../dist para compilar).
  rust:
    name: "3. Rust (fmt, clippy e testes)"
    needs: frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes
        run: cargo test

  # Etapa 3b: auditoria de dependências (roda em paralelo ao Rust).
  seguranca:
    name: "3b. Segurança (npm audit e cargo audit)"
    needs: consistencia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # O cargo audit só falha com vulnerabilidades; avisos de "unmaintained" não derrubam a etapa.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  # Etapa 4: instalador completo (assinado quando houver segredos).
  pacote:
    name: "4. Pacote (instalador NSIS)"
    needs: [frontend, rust, seguranca]
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build assinado (com segredos)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: npx tauri build
      - name: Build sem empacotar (sem segredos, por exemplo PR de fork)
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: npx tauri build --no-bundle
      - name: Enviar instalador
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 7
          if-no-files-found: error
